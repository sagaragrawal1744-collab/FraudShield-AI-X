<!DOCTYPE html>
<html>

<head>
<title>FraudShield-AI-X</title>

<style>

body{
    background:#0f172a;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#1e293b;
    width:550px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    color:#38bdf8;
}

input{
    width:85%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0284c7;
}

.result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

.rowbox{
    margin-top:15px;
    background:#334155;
    padding:12px;
    border-radius:10px;
}

.stats{
    margin-top:20px;
    background:#334155;
    padding:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="card">

<h1>🛡 FraudShield-AI-X</h1>

<p>AI Powered Banking Fraud Detection System</p>

<form method="POST">

<input
type="number"
name="row"
value="{{ row_value }}"
placeholder="Enter Transaction Row Number"
required>

<br>

<button type="submit">
Predict
</button>

</form>

{% if row_value %}

<div class="rowbox">

<h3>Transaction Row Checked</h3>

<p>{{ row_value }}</p>

</div>

{% endif %}

<div class="result">

{{ result }}

</div>

<div class="stats">

<h3>Model Performance</h3>

<p>Accuracy : 99.94%</p>

<p>Fraud Recall : 95.24%</p>

<p>F1 Score : 97.56%</p>

</div>

</div>

</body>
</html>
